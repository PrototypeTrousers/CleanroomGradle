plugins {
    id 'java'
    // id 'groovy'
    id 'idea'
    id 'java-gradle-plugin'
    id 'maven-publish'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

group = 'com.cleanroommc'
version = '0.0.1'

repositories {
    maven {
        name = 'MinecraftForge'
        url = "https://maven.minecraftforge.net/"
        mavenContent {
            includeGroup 'de.oceanlabs.mcp'
            includeGroup 'net.minecraftforge'
        }
    }
    maven {
        name = "paper"
        url = uri("https://repo.papermc.io/repository/maven-public/")
        mavenContent {
            includeGroup("org.cadixdev")
        }
    }
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.guava:guava:33.2.1-jre'
    implementation 'commons-io:commons-io:2.15.1'
    implementation 'commons-codec:commons-codec:1.16.0'
    implementation 'io.github.java-diff-utils:java-diff-utils:4.12'
    implementation 'org.ow2.asm:asm:9.6'
    implementation 'org.ow2.asm:asm-commons:9.6'
    implementation 'org.ow2.asm:asm-tree:9.6'
    implementation 'org.ow2.asm:asm-util:9.6'
    implementation 'de.undercouch.download:de.undercouch.download.gradle.plugin:5.6.0'
    implementation 'net.minecraftforge:srgutils:0.5.10'
    implementation 'net.minecraftforge:accesstransformers:8.2.1'
    implementation 'de.siegmar:fastcsv:3.0.0'
    implementation 'com.opencsv:opencsv:5.10'
    implementation("org.cadixdev:mercury:0.1.2-paperweight-SNAPSHOT")
    implementation 'org.cadixdev:lorenz:0.5.7'
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.17.0'
    implementation 'com.github.abrarsyed.jastyle:jAstyle:1.3'
    //implementation 'fr.inria.gforge.spoon:spoon-core:10.3.0'
}

gradlePlugin {
    plugins {
        cleanroomGradle {
            id = "${group}.gradle"
            implementationClass = "${group}.gradle.CleanroomGradle"
        }
    }
}

